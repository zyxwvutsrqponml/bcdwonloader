[package]
name = "bcdownloader"
version = "0.1.0"
edition = "2021"
description = "Perfect parallel resumable downloader for Blockchair database dumps (e.g. bitcoin addresses TSV.gz)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/"
rust-version = "1.75"
keywords = ["blockchair", "bitcoin", "downloader", "tsv", "parallel"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "bcdownloader"
path = "src/main.rs"

[lib]
name = "bcdownloader"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.38", features = ["full"] }
